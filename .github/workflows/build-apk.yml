name: Compilar APK

# Modelado en el workflow "Compilar APK" de DatGarScanApp:
# push a main + workflow_dispatch, compila el APK debug con Gradle
# y lo sube como artifact. No necesita secretos: el build debug usa
# la llave de depuración por defecto de Android.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generar wrapper de Gradle (si no existe)
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Subir el APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: guerradegusanos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
